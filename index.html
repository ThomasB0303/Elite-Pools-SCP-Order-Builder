<!DOCTYPE html>
<html>
<head>
  <title>Elite Pools SCP Order App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eaf6ff;
      color: #0f172a;
    }

    .app {
      max-width: 900px;
      margin: auto;
      padding: 16px;
    }

    header {
      background: linear-gradient(135deg, #0369a1, #0284c7);
      color: white;
      padding: 20px;
      border-radius: 18px;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0;
    }

    .top-bar {
      position: sticky;
      top: 0;
      background: #eaf6ff;
      padding: 10px 0;
      z-index: 5;
    }

    .count {
      background: #075985;
      color: white;
      padding: 10px;
      border-radius: 999px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 8px;
    }

    #searchInput {
      width: 100%;
      padding: 13px;
      border-radius: 12px;
      border: 1px solid #93c5fd;
      font-size: 16px;
      margin-bottom: 8px;
      box-sizing: border-box;
    }

    .section-title {
      background: #bae6fd;
      color: #075985;
      padding: 10px;
      border-radius: 10px;
      font-weight: bold;
      text-align: center;
      margin-top: 16px;
      border: 1px solid #7dd3fc;
    }

    .item {
      background: white;
      border: 1px solid #cfe8f8;
      border-radius: 14px;
      padding: 14px;
      margin: 8px 0;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }

    .item.added {
      border-left: 6px solid #0284c7;
      background: #f0f9ff;
    }

    .item-name {
      font-weight: bold;
    }

    .part {
      color: #475569;
      font-size: 14px;
      margin-top: 4px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 12px 14px;
      background: #0369a1;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .complete {
      width: 100%;
      background: #0284c7;
      margin-top: 10px;
      font-size: 17px;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, .65);
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 20;
    }

    .modal-box {
      background: white;
      padding: 20px;
      border-radius: 18px;
      max-width: 460px;
      width: 100%;
      max-height: 92vh;
      overflow: auto;
    }

    input, textarea, select {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      margin-bottom: 12px;
      font-size: 16px;
      border-radius: 10px;
      border: 1px solid #93c5fd;
      box-sizing: border-box;
    }

    #quantityInput {
      text-align: center;
      font-size: 34px;
      font-weight: bold;
      background: #f0f9ff;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }

    .keypad button {
      font-size: 24px;
      padding: 18px;
      background: #e0f2fe;
      color: #075985;
      border: 1px solid #7dd3fc;
    }

    .keypad .clear {
      background: #fee2e2;
      color: #991b1b;
      border-color: #fecaca;
    }

    textarea {
      min-height: 230px;
      font-family: Arial, sans-serif;
    }

    .cancel {
      background: #64748b;
      width: 100%;
      margin-top: 8px;
    }

    .add {
      background: #0284c7;
      width: 100%;
    }

    .danger {
      background: #b91c1c;
      width: 100%;
      margin-top: 8px;
    }

    .order-row {
      background: #f0f9ff;
      border: 1px solid #bae6fd;
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
    }

    .remove-small {
      background: #b91c1c;
      padding: 8px 10px;
      font-size: 13px;
    }

    @media(max-width: 600px) {
      .item, .order-row {
        flex-direction: column;
        align-items: stretch;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <header>
      <h1>Elite Pools SCP Order Builder App</h1>
      <p>Walk the list, tap what you need, enter quantity, complete order.</p>
    </header>

    <div class="top-bar">
      <div class="count"><span id="orderCount">0</span> item(s) added</div>
      <input type="text" id="searchInput" placeholder="Search item or part number...">
      <button class="complete" onclick="completeOrder()">Complete Order</button>
    </div>

    <div id="inventory"></div>

    <button class="complete" onclick="completeOrder()">Complete Order</button>
  </div>

  <div class="modal" id="quantityModal">
    <div class="modal-box">
      <h2 id="modalItemName"></h2>
      <p id="modalPartNumber"></p>

      <label>Quantity to order</label>
      <input type="text" id="quantityInput" readonly placeholder="0">

      <div class="keypad">
        <button onclick="pressNumber('1')">1</button>
        <button onclick="pressNumber('2')">2</button>
        <button onclick="pressNumber('3')">3</button>
        <button onclick="pressNumber('4')">4</button>
        <button onclick="pressNumber('5')">5</button>
        <button onclick="pressNumber('6')">6</button>
        <button onclick="pressNumber('7')">7</button>
        <button onclick="pressNumber('8')">8</button>
        <button onclick="pressNumber('9')">9</button>
        <button class="clear" onclick="clearQuantity()">Clear</button>
        <button onclick="pressNumber('0')">0</button>
        <button class="clear" onclick="backspaceQuantity()">⌫</button>
      </div>

      <label>Order Unit</label>
      <select id="unitInput">
        <option value="each">each</option>
        <option value="box">box</option>
        <option value="boxes">boxes</option>
        <option value="pallet">pallet</option>
        <option value="pallets">pallets</option>
        <option value="roll">roll</option>
        <option value="rolls">rolls</option>
        <option value="bundle">bundle</option>
        <option value="bundles">bundles</option>
        <option value="case">case</option>
        <option value="cases">cases</option>
        <option value="full box">full box</option>
        <option value="full shelf">full shelf</option>
      </select>

      <label>Notes optional</label>
      <input type="text" id="noteInput" placeholder="Example: urgent, confirm stock, etc.">

      <button class="add" onclick="addToOrder()">Add to Order</button>
      <button class="cancel" onclick="closeModal()">Cancel</button>
    </div>
  </div>

  <div class="modal" id="emailModal">
    <div class="modal-box">
      <h2>Order List</h2>

      <div id="orderPreview"></div>

      <textarea id="emailOutput"></textarea>

      <button class="add" onclick="copyEmail()">Copy List</button>
      <button class="danger" onclick="clearOrder()">Clear Current Order</button>
      <button class="cancel" onclick="closeEmailModal()">Close</button>
    </div>
  </div>

  <script>

      { section: "Skimmer Parts", name: "Square Lid Assembly Gray", part: "WWP-25-1954" },
      { section: "Skimmer Parts", name: "Square Lid Assembly White", part: "WWP-25-1952" },

      { section: "Misc.", name: "Telescopic Poles", part: "RAI-40-2110" },

      { section: "Electrical", name: "Beige 100W Transformer (12/13/14V)", part: "JJE-30-0100" },
      { section: "Electrical", name: "1\" NPT Water Bonding Fitting", part: "PB-2008" },

      { section: "Conduit", name: "1\" bell end 90's", part: "LAS-57-1040" },

      { section: "Misc.", name: "Gator Bond", part: "AAR-65-1071" },
      { section: "Misc.", name: "White Adheasive", part: "NOV-60-210" },
      { section: "Misc.", name: "Gray Grout", part: "NOV-60-213" },
      { section: "Misc.", name: "White Grout", part: "NOV-60-212" },
      { section: "Misc.", name: "Boss 801 Clear Silicone", part: "BOS-60-3000" },
      { section: "Misc.", name: "PVC Pipe Blue Glue", part: "IPS-60-5250" },
      { section: "Misc.", name: "Pool Brushes", part: "PSL-40-0170" },
      { section: "Misc.", name: "Pool Nets", part: "PSL-40-0308" },
      { section: "Misc.", name: "Pool Heavy Duty Nets", part: "PSL-40-2023" },
      { section: "Misc.", name: "Pool Vacuums", part: "PSL-40-0955" },
      { section: "Misc.", name: "Pool Backwash Hose 50'", part: "PSL-40-2109" },
      { section: "Misc.", name: "Skimmer Baskets w/ Tower", part: "GVT-60-501" },

      { section: "CONEX", name: "SKIMMERS - Round Lid Round Style 007", part: "Straight From River Pools" },
      { section: "CONEX", name: "MURIATIC ACID", part: "AAA-50-8602" }
    ];

    let order = [];
    let selectedItem = null;

    function saveOrder() {
      localStorage.setItem("eliteOrderAppCurrentOrder", JSON.stringify(order));
    }

    function loadOrder() {
      const saved = localStorage.getItem("eliteOrderAppCurrentOrder");
      if (saved) {
        order = JSON.parse(saved);
      }
    }

    function renderInventory() {
      const inventory = document.getElementById("inventory");
      const searchText = document.getElementById("searchInput").value.toLowerCase().trim();

      inventory.innerHTML = "";
      let currentSection = "";

      items.forEach((item, index) => {
        const searchableText = (item.section + " " + item.name + " " + item.part).toLowerCase();

        if (searchText && !searchableText.includes(searchText)) {
          return;
        }

        if (item.section !== currentSection) {
          currentSection = item.section;
          inventory.innerHTML += `<div class="section-title">${currentSection}</div>`;
        }

        const existing = order.find(o => o.index === index);

        inventory.innerHTML += `
          <div class="item ${existing ? "added" : ""}">
            <div>
              <div class="item-name">${item.name}</div>
              <div class="part">Part #: ${item.part || "N/A"}</div>
              ${existing ? `<div class="part"><strong>Added: ${existing.quantity} ${existing.unit}</strong></div>` : ""}
            </div>
            <button onclick="openModal(${index})">${existing ? "Edit" : "Add"}</button>
          </div>
        `;
      });

      updateOrderCount();
    }

    function updateOrderCount() {
      document.getElementById("orderCount").innerText = order.length;
    }

    function openModal(index) {
      selectedItem = { ...items[index], index };
      const existing = order.find(o => o.index === index);

      document.getElementById("modalItemName").innerText = selectedItem.name;
      document.getElementById("modalPartNumber").innerText = "Part #: " + (selectedItem.part || "N/A");
      document.getElementById("quantityInput").value = existing ? existing.quantity : "";
      document.getElementById("unitInput").value = existing ? existing.unit : "each";
      document.getElementById("noteInput").value = existing ? existing.note : "";

      document.getElementById("quantityModal").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("quantityModal").style.display = "none";
    }

    function pressNumber(num) {
      const input = document.getElementById("quantityInput");
      input.value += num;
    }

    function clearQuantity() {
      document.getElementById("quantityInput").value = "";
    }

    function backspaceQuantity() {
      const input = document.getElementById("quantityInput");
      input.value = input.value.slice(0, -1);
    }

    function addToOrder() {
      const quantity = document.getElementById("quantityInput").value.trim();
      const unit = document.getElementById("unitInput").value;
      const note = document.getElementById("noteInput").value.trim();

      if (!quantity || Number(quantity) <= 0) {
        alert("Enter a quantity first.");
        return;
      }

      const existingIndex = order.findIndex(o => o.index === selectedItem.index);

      const orderItem = {
        ...selectedItem,
        quantity,
        unit,
        note
      };

      if (existingIndex >= 0) {
        order[existingIndex] = orderItem;
      } else {
        order.push(orderItem);
      }

      order.sort((a, b) => a.index - b.index);

      saveOrder();
      closeModal();
      renderInventory();
    }

    function buildOrderList() {
      let list = "";

      order.forEach(item => {
        list += item.quantity + " " + item.unit + " - " + item.name;

        if (item.part) {
          list += " (" + item.part + ")";
        }

        if (item.note) {
          list += " - " + item.note;
        }

        list += String.fromCharCode(10);
      });

      return list.trim();
    }

    function renderOrderPreview() {
      const preview = document.getElementById("orderPreview");
      preview.innerHTML = "";

      order.forEach((item, orderIndex) => {
        preview.innerHTML += `
          <div class="order-row">
            <div>
              <strong>${item.quantity} ${item.unit} - ${item.name}</strong>
              <div class="part">${item.part || "No part number"}</div>
            </div>
            <button class="remove-small" onclick="removeOrderItem(${orderIndex})">Remove</button>
          </div>
        `;
      });
    }

    function completeOrder() {
      if (order.length === 0) {
        alert("You have not added anything to the order yet.");
        return;
      }

      renderOrderPreview();
      document.getElementById("emailOutput").value = buildOrderList();
      document.getElementById("emailModal").style.display = "flex";
    }

    function closeEmailModal() {
      document.getElementById("emailModal").style.display = "none";
    }

    function copyEmail() {
      const text = document.getElementById("emailOutput");
      text.select();
      document.execCommand("copy");
      alert("Copied.");
    }

    function removeOrderItem(orderIndex) {
      order.splice(orderIndex, 1);
      saveOrder();
      renderInventory();

      if (order.length === 0) {
        closeEmailModal();
        return;
      }

      renderOrderPreview();
      document.getElementById("emailOutput").value = buildOrderList();
    }

    function clearOrder() {
      const confirmClear = confirm("Clear the current order?");
      if (!confirmClear) return;

      order = [];
      saveOrder();
      closeEmailModal();
      renderInventory();
    }

    document.getElementById("searchInput").addEventListener("input", renderInventory);

    loadOrder();
    renderInventory();
  </script>
</body>
</html>
